name: Package checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  package:
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Check out authoritative C++ source
        uses: actions/checkout@v4
        with:
          repository: ibist/ibist-R
          path: _r_reference
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shared C++ core synchronization
        run: python tools/check_shared_core.py --r-source _r_reference
      - name: Install packaging tools
        run: python -m pip install build twine pytest
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Install wheel
        run: |
          python -c "import glob, subprocess, sys; subprocess.check_call(
          [sys.executable, '-m', 'pip', 'install'] + glob.glob('dist/*.whl'))"
      - name: Run statistical and dataset checks
        run: python -m pytest -q
      - name: Verify installed import
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import ibist
          from importlib.metadata import version

          assert ibist.__version__ == version("ibist")
          print(ibist.__version__)
          PY
