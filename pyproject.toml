[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ibist"
dynamic = ["version"]
description = "Teaching data and biostatistical inference for proportions and rates"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0",
                "statsmodels>=0.14"]
authors = [
    {name = "Elizabeth Schifano"},
    {name = "Jun Yan", email = "jun.yan@uconn.edu"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "twine>=6"]

[project.urls]
Repository = "https://github.com/ibist/ibist-py"
Issues = "https://github.com/ibist/ibist-py/issues"
"R package" = "https://github.com/ibist/ibist-R"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ibist.__version__"}

[tool.setuptools.package-data]
ibist = ["_data/*.json", "_data/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp312-manylinux_x86_64"
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
test-requires = ["pytest>=7"]
test-command = "python -m pytest -q {project}/tests"
