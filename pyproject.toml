[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ibist-py"
dynamic = ["version"]
description = "Teaching data and biostatistical inference for proportions and rates"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Elizabeth Schifano"},
    {name = "Jun Yan", email = "jun.yan@uconn.edu"},
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/ibist/ibist-py"
Issues = "https://github.com/ibist/ibist-py/issues"
"R package" = "https://github.com/ibist/ibist-R"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ibist.__version__"}
